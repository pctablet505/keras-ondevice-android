<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="408" viewBox="0 0 1000 408" role="img" aria-labelledby="t d">
  <title id="t">From a Keras model to the phone</title>
  <desc id="d">On the computer: a pretrained Keras model, MobileNetV3 Small, goes through one export call, model.export with format litert and one fixed input size, and becomes two files: the model, mobilenetv3.tflite, and its settings, mobilenetv3.json. adb push copies both to /data/local/tmp. On the phone the app finds the pair, resizes the photo to 224 by 224, scales each colour with the numbers from the .json file, and runs the model on the phone's CPU with 4 threads, showing five labels on the screen.</desc>
  <style>
    .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .box{fill:#1e293b;stroke:#64748b;stroke-width:2}
    .h{fill:#f8fafc;font-size:18px;font-weight:600}
    .t{fill:#cbd5e1;font-size:16px}
    .q{fill:#94a3b8;font-size:14px}
    .a{stroke:#fbbf24;stroke-width:2.5;fill:none}
    .ah{fill:#fbbf24}
    .al{fill:#fbbf24;font-size:14px}
  </style>
  <rect width="1000" height="408" rx="16" fill="#0f172a"/>
  <rect x="0.5" y="0.5" width="999" height="407" rx="15.5" fill="none" stroke="#1e293b"/>

  <rect class="box" x="32" y="40" width="272" height="132" rx="10"/>
  <text class="s h" x="52" y="76">A Keras model</text>
  <text class="s t" x="52" y="106">MobileNetV3 Small</text>
  <text class="m q" x="52" y="132">from_preset(...)</text>

  <path class="a" d="M304 106H352"/>
  <path class="ah" d="M352 99L364 106L352 113Z"/>

  <rect class="box" x="364" y="40" width="272" height="132" rx="10"/>
  <text class="s h" x="384" y="76">One export call</text>
  <text class="m t" x="384" y="106">model.export(...)</text>
  <text class="m q" x="384" y="132">format='litert'</text>
  <text class="s q" x="384" y="156">one fixed input size</text>

  <path class="a" d="M636 106H684"/>
  <path class="ah" d="M684 99L696 106L684 113Z"/>

  <rect class="box" x="696" y="40" width="272" height="132" rx="10"/>
  <text class="s h" x="716" y="76">Two files</text>
  <text class="m t" x="716" y="106">mobilenetv3.tflite</text>
  <rect x="708" y="114" width="248" height="26" rx="6" fill="#fbbf24" fill-opacity="0.16"/>
  <text class="m t" x="716" y="132">mobilenetv3.json</text>
  <text class="s q" x="716" y="160">the model, and its settings</text>

  <path class="a" d="M832 172V208H168V232"/>
  <path class="ah" d="M161 232L168 244L175 232Z"/>
  <text class="m al" x="500" y="200" text-anchor="middle">adb push</text>

  <rect class="box" x="32" y="244" width="272" height="132" rx="10"/>
  <text class="s h" x="52" y="280">On the phone</text>
  <text class="m t" x="52" y="310">/data/local/tmp</text>
  <text class="s q" x="52" y="336">the app finds the pair</text>

  <path class="a" d="M304 310H352"/>
  <path class="ah" d="M352 303L364 310L352 317Z"/>

  <rect class="box" x="364" y="244" width="272" height="132" rx="10"/>
  <text class="s h" x="384" y="280">Prepare the photo</text>
  <text class="s t" x="384" y="310">resize to 224 by 224</text>
  <text class="s q" x="384" y="336">scale each colour</text>
  <text class="s q" x="384" y="360">with the .json numbers</text>

  <path class="a" d="M636 310H684"/>
  <path class="ah" d="M684 303L696 310L684 317Z"/>

  <rect class="box" x="696" y="244" width="272" height="132" rx="10"/>
  <text class="s h" x="716" y="280">Run</text>
  <text class="s t" x="716" y="310">on the phone's CPU</text>
  <text class="s q" x="716" y="336">4 threads</text>
  <text class="s q" x="716" y="360">five labels on the screen</text>
</svg>
