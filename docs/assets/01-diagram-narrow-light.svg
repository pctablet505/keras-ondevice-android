<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" role="img" aria-labelledby="t d">
  <title id="t">From a KerasHub preset to the phone</title>
  <desc id="d">The same path, for narrow screens. The KerasHub preset MobileNetV3 Small goes through one export call with format litert. Two files come out, the .tflite model and its .json sidecar. adb push copies them to /data/local/tmp on the phone. The app preprocesses the photo with the sidecar's numbers and runs the Interpreter on the CPU.</desc>
  <style>
    .s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .box{fill:#f8fafc;stroke:#64748b;stroke-width:2}
    .h{fill:#0f172a;font-size:16px;font-weight:600}
    .t{fill:#334155;font-size:14px}
    .q{fill:#475569;font-size:13px}
    .a{stroke:#b45309;stroke-width:2.5;fill:none}
    .ah{fill:#b45309}
  </style>
  <rect width="420" height="400" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="419" height="399" rx="15.5" fill="none" stroke="#e2e8f0"/>

  <rect class="box" x="16" y="24" width="180" height="96" rx="10"/>
  <text class="s h" x="30" y="58">KerasHub preset</text>
  <text class="s t" x="30" y="86">MobileNetV3 Small</text>

  <path class="a" d="M196 72H212"/>
  <path class="ah" d="M212 66L224 72L212 78Z"/>

  <rect class="box" x="224" y="24" width="180" height="96" rx="10"/>
  <text class="s h" x="238" y="58">One export call</text>
  <text class="m t" x="238" y="86">format='litert'</text>

  <path class="a" d="M314 120V136H106V140"/>
  <path class="ah" d="M100 140L106 152L112 140Z"/>

  <rect class="box" x="16" y="152" width="180" height="96" rx="10"/>
  <text class="s h" x="30" y="186">Two files</text>
  <rect x="24" y="196" width="164" height="24" rx="6" fill="#fef3c7"/>
  <text class="m t" x="30" y="213">.tflite + .json</text>

  <path class="a" d="M196 200H212"/>
  <path class="ah" d="M212 194L224 200L212 206Z"/>

  <rect class="box" x="224" y="152" width="180" height="96" rx="10"/>
  <text class="s h" x="238" y="186">On the phone</text>
  <text class="s q" x="238" y="208">adb push to</text>
  <text class="m t" x="238" y="230">/data/local/tmp</text>

  <path class="a" d="M314 248V264H106V268"/>
  <path class="ah" d="M100 268L106 280L112 268Z"/>

  <rect class="box" x="16" y="280" width="180" height="96" rx="10"/>
  <text class="s h" x="30" y="314">Preprocess</text>
  <text class="s t" x="30" y="342">sidecar numbers</text>

  <path class="a" d="M196 328H212"/>
  <path class="ah" d="M212 322L224 328L212 334Z"/>

  <rect class="box" x="224" y="280" width="180" height="96" rx="10"/>
  <text class="s h" x="238" y="314">Run</text>
  <text class="s t" x="238" y="342">Interpreter, CPU</text>
</svg>
